spring.application.name=catalogo-papeleria
server.port=8080

# Conexión a MySQL (contenedor definido en compose.yaml)
spring.datasource.url=jdbc:mysql://localhost:3306/papeleria_db
spring.datasource.username=papeleria_user
spring.datasource.password=${MYSQL_PASSWORD}

# ORM (Hibernate / Spring Data JPA)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html
